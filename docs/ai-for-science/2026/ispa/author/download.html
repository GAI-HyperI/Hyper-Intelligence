<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICA3PP 2025 | IEEE Cybermatics Congress 2025</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .download-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input[type="url"] {
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #status {
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>文件下载器</h1>
    <div class="download-container">
        <label for="fileUrl">输入文件URL：</label>
        <input type="url" id="fileUrl" placeholder="https://example.com/file.pdf" required>
        <button id="downloadBtn">下载文件</button>
        <div id="status"></div>
    </div>

    <script>
        document.getElementById('downloadBtn').addEventListener('click', function() {
            const url = document.getElementById('fileUrl').value.trim();
            const statusDiv = document.getElementById('status');

            if (!url) {
                statusDiv.textContent = "请输入有效的URL！";
                statusDiv.style.color = "red";
                return;
            }

            // 创建隐藏的下载链接
            const a = document.createElement('a');
            a.href = url;
            
            // 尝试从URL中提取文件名，否则使用默认名
            const fileName = url.split('/').pop() || 'downloaded_file';
            a.download = fileName;
            
            // 兼容性处理：某些浏览器需要添加到DOM中才能工作
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            // 显示状态信息
            statusDiv.textContent = `正在下载: ${fileName}`;
            statusDiv.style.color = "green";

            // 清空输入框（可选）
            // document.getElementById('fileUrl').value = '';
        });

        // 按Enter键触发下载
        document.getElementById('fileUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('downloadBtn').click();
            }
        });
    </script>
</body>
</html>
